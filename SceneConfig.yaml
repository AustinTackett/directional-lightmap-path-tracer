# Lightmap Path Tracing
number_of_samples: 64     # maximum number of samples if pixel doesn't converge
min_samples: 64           # how many samples must pass before we check if sample has converged
relative_error: 0.05      # when sample is marked as converged
max_bounces: 3            # how many rays per sample (3 := 1 direct + 2 bounces)
tile_width: 2048          # when sampling how many pixels to to execute at the same time
tile_height: 2048    

# Directional Light Settings
sun_direction: [-0.35, -1.4, -0.25]   # XYZ direction
sun_irradiance: [5.0, 5.0, 5.0]       # RGB channels

# Camera Settings
camera_fov:   60.0                           # degrees
camera_speed: 2.5                            # speed in world units
camera_position: [-7.2048, 1.2064, 0.96592]  # position in world units

# File paths are relative to this file
model-path: assets/sponza/glTF/Sponza.gltf   # must have model path
hdri-path:  assets/hdris/smelting_tower.hdr  # optional: "" indicates no hdri